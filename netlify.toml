[build]
  publish = "wwawing.com"
  command = "pnpm start"

  # 以下の理由により、 Node.js のバージョンはここでは指定しない。
  # - Netlify は Node.js のバージョンの決定に nvm か mise のどちらかが使われる。
  #   - nvm の場合は .node-version を見るので解決される。
  #   - mise の場合は mise.toml に idiomatic_version_file_enable_tools の指定があるので、結局 .node-version を参照する。

[[redirects]]
  from = "/wing/24life.html"
  to = "https://archive.chashitsu.org/wing/24life/24life.html"

[[redirects]]
  from = "/wing/kuso6.html"
  to = "https://hirarira.net/wwa/kuso/kuso06/"

[[redirects]]
  from = "/wing/moneyXP.html"
  to = "https://archive.chashitsu.org/wing/moneyxp.html"

[[redirects]]
  from = "/wing/seikatsu.html"
  to = "https://archive.chashitsu.org/wing/seikatsu.html"

[[redirects]]
  from = "/wing/spaceisland.html"
  to = "https://archive.chashitsu.org/wing/seikatsu.html"

[[redirects]]
  from = "/wwaaa/*"
  to = "https://old-experiments.wwawing.com/wwaaa/:splat"

[[redirects]]
  from = "/wing-x/*"
  to = "https://old-experiments.wwawing.com/wing-x/:splat"

[[redirects]]
  from = "/wwap"
  to = "https://wwaphoenix.github.io/"

[[redirects]]
  from ="/acorn-statement/*"
  to = "/unstable/:splat"
